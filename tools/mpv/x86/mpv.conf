# ==============================================================================
# Configuracao Otimizada do MPV para TV Digital ISDB-T/ISDB-Tb 1-Seg (x86 / 32-bit)
# Maxima Compatibilidade com Hardware Legado e Baixo Consumo de Recursos
# ==============================================================================

# 1. Renderizador de Video e Aceleracao Estavel para x86 (32-bit)
vo=gpu
gpu-api=d3d11
hwdec=no

# 2. Perfil de Renderizacao (Perfil Leve e Rapido)
profile=fast

# 3. Escalonamento e Filtros de Imagem (Upscaling Leve 320x240/180 -> Tela)
scale=spline36
cscale=bilinear
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes

# 4. Sincronismo de Audio/Video para Live Stream UDP (TV Aberta ao Vivo)
video-sync=audio
interpolation=no

# 5. Filtro de Debanding Dinamico Leve
deband=yes
deband-iterations=1
deband-threshold=32
deband-range=16
deband-grain=8

# 6. Otimizacoes de Buffer para Streaming UDP MPEG-TS ao Vivo (1-Seg ~312 kbps, GOP ~1.5s - 2.0s)
demuxer-lavf-format=mpegts
demuxer-lavf-probesize=65536
demuxer-lavf-analyzeduration=1.0
demuxer-lavf-buffersize=65536
cache=no
cache-secs=1.0
demuxer-readahead-secs=1.0
force-seekable=no
untimed=no

# 7. Janela e Interface
idle=yes
keep-open=always
force-window=immediate
input-ipc-server=\\.\pipe\isdbtb_mpv
geometry=640x360
video-unscaled=no
video-zoom=0
title="ISDB-T/Tb 1-Seg"
osd-font-size=12
osd-color='#CCFFFFFF'
osd-border-color='#99000000'

# ==============================================================================
# Configuracao Otimizada do MPV para TV Digital ISDB-T/ISDB-Tb 1-Seg (x64 / 64-bit)
# Interpolação de Resolução e Movimento em Tempo Real via GPU
# ==============================================================================

# 1. Renderizador de Video de Nova Geracao
vo=gpu-next,gpu
gpu-api=d3d11,auto
hwdec=auto-safe

# 2. Perfil de Alta Fidelidade
profile=gpu-hq

# 3. Interpolação Espacial de Resolução (Upscaling 320x240/180 -> 1080p/4K)
# Utiliza EWA-Lanczos Sharp (Jinc sinc) para reconstruir bordas limpas e nitidas
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# 4. Sincronismo de Audio/Video para Live Stream UDP (TV Aberta ao Vivo)
video-sync=audio
interpolation=no

# 5. Filtro de Debanding Dinamico (Elimina faixas de cores e macroblocos de baixa taxa)
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=16

# 6. Otimizacoes de Buffer para Streaming UDP MPEG-TS ao Vivo (1-Seg ~312 kbps, GOP ~1.5s - 2.0s)
demuxer-lavf-format=mpegts
demuxer-lavf-probesize=65536
demuxer-lavf-analyzeduration=1.0
demuxer-lavf-buffersize=65536
cache=no
cache-secs=1.0
demuxer-readahead-secs=1.0
force-seekable=no
untimed=no

# 7. Janela e Interface
idle=yes
keep-open=always
force-window=immediate
input-ipc-server=\\.\pipe\isdbtb_mpv
geometry=640x360
video-unscaled=no
video-zoom=0
title="ISDB-T/Tb 1-Seg"
osd-font-size=12
osd-color='#CCFFFFFF'
osd-border-color='#99000000'

# ==============================================================================
# Configuracao Otimizada do MPV para TV Digital ISDB-T/ISDB-Tb 1-Seg
# Interpolação de Resolução e Movimento em Tempo Real via GPU
# ==============================================================================

# 1. Renderizador de Video de Nova Geracao
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe

# 2. Perfil de Alta Fidelidade
profile=gpu-hq

# 3. Interpolação Espacial de Resolução (Upscaling 320x240/180 -> 1080p/4K)
# Utiliza EWA-Lanczos Sharp (Jinc sinc) para reconstruir bordas limpas e nitidas
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# 4. Interpolação Temporal de Quadros (Motion Smoothing / Suavizacao 15/30 fps -> 60/144Hz)
# Sincroniza a exibicao ao refresh rate do monitor eliminando judder e engasgos
video-sync=display-resample
interpolation=yes
tscale=oversample

# 5. Filtro de Debanding Dinamico (Elimina faixas de cores e macroblocos de baixa taxa)
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=16

# 6. Otimizacoes de Buffer para Streaming UDP MPEG-TS ao Vivo
demuxer-lavf-probesize=32768
demuxer-lavf-analyzeduration=0.5
cache=yes
cache-secs=2.0
demuxer-readahead-secs=2.0
force-seekable=no
untimed=no

# 7. Janela e Interface
keep-open=yes
force-window=yes
autofit=960x540
title="ISDB-T 1-Seg | MPV [Interpolação de Resolução e Movimento em Tempo Real]"
osd-font-size=24
osd-color='#CCFFFFFF'
osd-border-color='#99000000'

